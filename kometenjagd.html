<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kometenjagd</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Rubik:wght@500;700;800&display=swap">
<style>
/* Layout: full-screen night-sky play field (max 560px wide, centered); HUD drawn on canvas; menus are glass panels over it.
   Deliberately single dark theme: it is an arcade sky. */
:root{
  --sky1:#120c2c; --sky2:#2b1553; --ink:#f4effe; --muted:#b9acd9; --line:rgba(255,255,255,.14);
  --panel:rgba(26,17,56,.88); --hot:#ff7a45; --gem:#5fe6ff; --gold:#ffd166; --danger:#ff4d6d;
  --font-display:"Bungee","Rubik",Impact,system-ui,sans-serif;
  --font-body:"Rubik",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{margin:0;background:var(--sky1);color:var(--ink);font-family:var(--font-body);-webkit-tap-highlight-color:transparent;overscroll-behavior:none;user-select:none;-webkit-user-select:none}
[hidden]{display:none!important}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
#app{position:relative;height:100%;width:100%}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.corner{position:absolute;top:10px;display:flex;gap:8px;z-index:5}
.corner.l{left:max(12px,env(safe-area-inset-left,0px))}
.corner.r{right:max(12px,env(safe-area-inset-right,0px))}
.ibtn{width:44px;height:44px;border-radius:14px;background:rgba(255,255,255,.08);border:1px solid var(--line);display:grid;place-items:center}
.ibtn svg{width:22px;height:22px}
.layer{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:10;padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:rgba(10,6,24,.35);overflow-y:auto}
.panel{width:100%;max-width:400px;background:var(--panel);border:1px solid var(--line);border-radius:26px;padding:24px 20px;display:flex;flex-direction:column;gap:14px;text-align:center;backdrop-filter:blur(6px);animation:in .22s ease-out;margin:auto}
@keyframes in{from{transform:translateY(16px) scale(.96);opacity:0}}
.title{font-family:var(--font-display);font-size:clamp(2.3rem,12vw,3.3rem);line-height:.95;margin:0;letter-spacing:.01em;background:linear-gradient(180deg,#fff 10%,var(--gold) 55%,var(--hot));-webkit-background-clip:text;background-clip:text;color:transparent;text-wrap:balance}
.sub{margin:0;color:var(--muted);font-size:1rem;line-height:1.4}
h3{margin:0;font-family:var(--font-display);font-size:2rem;font-weight:400}
.big{font-family:var(--font-display);font-size:3.4rem;line-height:1;font-variant-numeric:tabular-nums}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn{min-height:54px;padding:0 22px;border-radius:16px;font-weight:800;font-size:1.1rem;background:rgba(255,255,255,.08);border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .08s;flex:1}
.btn:active{transform:scale(.96)}
.btn.go{background:linear-gradient(180deg,#ffb15c,var(--hot));color:#2a0f00;border:0;font-family:var(--font-display);font-weight:400;font-size:1.45rem;min-height:64px;box-shadow:0 5px 0 #b8461f,0 0 30px rgba(255,122,69,.45)}
.btn.rev{background:linear-gradient(180deg,#8ff0ff,#2ab7e0);color:#04202a;border:0}
.btn[disabled]{opacity:.4}
.stats{display:flex;justify-content:center;gap:16px;color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums;flex-wrap:wrap}
.stats b{color:var(--ink)}
.cr{display:inline-flex;align-items:center;gap:5px;color:var(--gem);font-weight:800}
.cr svg{width:16px;height:16px}
.missions{display:flex;flex-direction:column;gap:8px;text-align:left}
.missions .lab{font-size:.75rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.mis{background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center;font-weight:700;font-size:.95rem}
.mis .bar{grid-column:1/-1;height:6px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden}
.mis .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gem),#a58bff)}
.mis.done{border-color:var(--gold)}
.mis.done .bar i{background:var(--gold)}
.badge{display:inline-block;background:var(--gold);color:#2a1a00;font-weight:800;border-radius:999px;padding:3px 12px;font-size:.85rem;align-self:center;animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
.shop{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.skin{border-radius:16px;background:rgba(255,255,255,.06);border:2px solid var(--line);padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:700;min-width:0}
.skin .orb{width:44px;height:44px;border-radius:50%}
.skin.sel{border-color:var(--gold)}
.skin small{color:var(--muted);font-weight:700}
#toast{position:absolute;left:50%;top:120px;transform:translateX(-50%);z-index:20;background:var(--gold);color:#2a1a00;font-weight:800;padding:10px 18px;border-radius:999px;white-space:nowrap;box-shadow:0 6px 24px rgba(0,0,0,.4);animation:toast 2.2s forwards;pointer-events:none;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-14px)}10%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-10px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <canvas id="cv"></canvas>
  <div class="corner l"><button class="ibtn" id="bPause" aria-label="Pause" hidden><svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1.5"/><rect x="14" y="5" width="4" height="14" rx="1.5"/></svg></button></div>
  <div class="corner r"><button class="ibtn" id="bMute" aria-label="Ton"></button></div>

  <div class="layer" id="menu">
    <div class="panel">
      <h1 class="title">Kometen&shy;jagd</h1>
      <p class="sub">Ziehe deinen Kometen nach links und rechts. Weiche Meteoren aus, sammle Kristalle. Es wird immer schneller.</p>
      <button class="btn go" id="bPlay">Spielen</button>
      <div class="stats"><span>Rekord <b id="mBest">0</b></span><span class="cr" id="mCr"></span></div>
      <div class="missions" id="mMis"></div>
      <div class="row"><button class="btn" id="bShop">Kometen-Shop</button></div>
    </div>
  </div>

  <div class="layer" id="over" hidden>
    <div class="panel">
      <h3 id="oHead">Abgestürzt!</h3>
      <span class="badge" id="oRec" hidden>Neuer Rekord!</span>
      <div class="big" id="oScore">0</div>
      <div class="stats"><span>Rekord <b id="oBest">0</b></span><span>Combo <b id="oCombo">0</b></span><span class="cr" id="oCr"></span></div>
      <button class="btn rev" id="bRevive" hidden></button>
      <button class="btn go" id="bAgain">Nochmal</button>
      <div class="missions" id="oMis"></div>
      <div class="row"><button class="btn" id="bShop2">Shop</button><button class="btn" id="bMenu">Menü</button></div>
    </div>
  </div>

  <div class="layer" id="shopL" hidden>
    <div class="panel">
      <h3>Kometen</h3>
      <div class="stats"><span class="cr" id="sCr"></span></div>
      <div class="shop" id="shopGrid"></div>
      <button class="btn" id="bShopBack">Zurück</button>
    </div>
  </div>

  <div class="layer" id="pauseL" hidden>
    <div class="panel">
      <h3>Pause</h3>
      <button class="btn go" id="bResume">Weiter</button>
      <button class="btn" id="bQuit">Runde beenden</button>
    </div>
  </div>
</div>

<script>
(()=>{
"use strict";
const $=s=>document.querySelector(s);
const KEY="kometenjagd-v1";
const MT={
  gems:{t:"Sammle {n} Kristalle in einer Runde",tiers:[20,40,70,110,160,230]},
  survive:{t:"Überlebe {n} Sekunden",tiers:[25,40,60,80,110,150]},
  near:{t:"{n}× knapp ausweichen in einer Runde",tiers:[3,6,10,16,25,35]},
  combo:{t:"Erreiche Combo {n}",tiers:[12,20,32,50,75,100]},
  fever:{t:"Löse {n}× den Feuer-Modus aus",tiers:[1,2,3,4,6,8]},
  score:{t:"Erreiche {n} Punkte",tiers:[600,1500,3000,5000,8000,12000]}
};
const SKINS=[
  {id:"funke",name:"Funke",price:0,c:["#fff4d6","#ffb347","#ff6a3d"]},
  {id:"eis",name:"Eisstern",price:60,c:["#f0fdff","#6fe3ff","#3a7bff"]},
  {id:"plasma",name:"Plasma",price:150,c:["#fff0ff","#ff6ad5","#9b4dff"]},
  {id:"smaragd",name:"Smaragd",price:300,c:["#f2fff6","#5dffa8","#14b87a"]},
  {id:"sonne",name:"Sonnensturm",price:550,c:["#ffffff","#ffe066","#ff9f1c"]},
  {id:"regen",name:"Regenbogen",price:900,c:null}
];
let save={best:0,crystals:0,skin:"funke",owned:["funke"],missions:null,tiers:{},mute:false,runs:0};
try{const r=localStorage.getItem(KEY);if(r)save=Object.assign(save,JSON.parse(r));}catch(e){}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(save));}catch(e){}}
function newMission(exclude){
  const types=Object.keys(MT).filter(t=>!exclude.includes(t));
  const type=types[Math.floor(Math.random()*types.length)];
  return{type,tier:Math.min(save.tiers[type]||0,MT[type].tiers.length-1)};
}
if(!save.missions){save.missions=[];for(let i=0;i<3;i++)save.missions.push(newMission(save.missions.map(m=>m.type)));persist();}
const target=m=>{const T=MT[m.type].tiers;const extra=Math.max(0,(save.tiers[m.type]||0)-(T.length-1));return Math.round(T[m.tier]*(1+extra*0.35));};
const reward=m=>25+m.tier*20;
const mText=m=>MT[m.type].t.replace("{n}",target(m));

/* ---------- canvas & sizing ---------- */
const cv=$("#cv"),ctx=cv.getContext("2d");
let W=0,H=0,F=0,FX=0,U=1,dpr=1,stars=[];
function resize(){
  const b=$("#app").getBoundingClientRect();W=b.width;H=b.height;
  dpr=Math.min(window.devicePixelRatio||1,2);cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
  F=Math.min(W,560);FX=(W-F)/2;U=Math.min(F/400,H/720);
  if(!stars.length)for(let i=0;i<90;i++)stars.push({x:Math.random(),y:Math.random(),z:0.2+Math.random()*0.8});
  if(G&&G.p){G.p.y=H*0.78;G.p.x=Math.min(Math.max(G.p.x,G.p.r),F-G.p.r);G.p.tx=G.p.x;}
}
window.addEventListener("resize",resize);

/* ---------- game state ---------- */
let G=null;
function reset(){
  G={state:"play",t:0,score:0,gems:0,combo:0,maxCombo:0,mult:1,near:0,fevers:0,feverCharge:0,fever:0,
     p:{x:F/2,tx:F/2,y:H*0.78,r:13*U,trail:[]},shield:0,invul:0,power:{magnet:0,slow:0},
     ents:[],parts:[],texts:[],sp:{met:1.2,gem:0.5,pow:8,beam:4},revived:false,shake:0,flash:0,flashC:"#fff",hitStop:0,dieT:0,
     act:save.missions.map(m=>({...m,done:false})),misT:0};
}
const speedF=()=>Math.min(1+G.t/32,3.5);
const V=()=>250*U*speedF();
const rnd=(a,b)=>a+Math.random()*(b-a);

function spawnMeteor(){
  if(G.fever>0){spawnGem(rnd(30*U,F-30*U),-30*U,V()*0.9);return;}
  const t=G.t,r=Math.random();
  const m={k:"met",x:Math.random()<0.3?G.p.x+rnd(-30,30)*U:rnd(20*U,F-20*U),y:-60*U,rot:Math.random()*6,vr:rnd(-2,2),minD:1e9,vx:0};
  if(t>22&&r<0.14){m.r=36*U;m.vy=V()*0.62;m.type="big";}
  else if(t>12&&r<0.4){m.r=11*U;m.vy=V()*1.65;m.type="fast";}
  else if(t>30&&r<0.58){m.r=17*U;m.vy=V()*0.95;m.type="zig";m.bx=m.x;m.ph=Math.random()*6;m.amp=rnd(40,90)*U;}
  else{m.r=rnd(14,24)*U;m.vy=V()*rnd(0.9,1.15);m.type="n";}
  m.x=Math.min(Math.max(m.x,m.r),F-m.r);if(m.bx!=null)m.bx=m.x;
  G.ents.push(m);
}
function spawnGem(x,y,vy){G.ents.push({k:"gem",x,y,vy,r:10*U,ph:Math.random()*6});}
function spawnChain(){
  const n=4+Math.floor(Math.random()*5),pat=Math.random(),dir=Math.random()<.5?-1:1;
  let x0=rnd(50*U,F-50*U);const vy=V()*0.88;
  for(let i=0;i<n;i++){
    let x=pat<0.35?x0:pat<0.75?x0+Math.sin(i*0.8)*60*U:x0+(i-n/2)*30*U*dir;
    x=Math.min(Math.max(x,16*U),F-16*U);spawnGem(x,-30*U-i*40*U,vy);
  }
}
const POWERS=["shield","magnet","slow"];
function spawnPower(){G.ents.push({k:"pow",type:POWERS[Math.floor(Math.random()*3)],x:rnd(40*U,F-40*U),y:-30*U,vy:V()*0.7,r:17*U,ph:0});}
function spawnBeam(){G.ents.push({k:"beam",x:Math.random()<0.5?G.p.x:rnd(40*U,F-40*U),w:58*U,warn:0.95,life:0.4});sfx("warn");}

function spawn(d){
  const t=G.t;
  if((G.sp.met-=d)<=0){G.sp.met=Math.max(0.16,0.82-t*0.011)*rnd(0.7,1.3);spawnMeteor();if(t>50&&Math.random()<0.25)spawnMeteor();}
  if((G.sp.gem-=d)<=0){G.sp.gem=rnd(1.1,2);spawnChain();}
  if((G.sp.pow-=d)<=0){G.sp.pow=rnd(9,15);spawnPower();}
  if(t>38&&(G.sp.beam-=d)<=0){G.sp.beam=Math.max(2.4,8-(t-38)*0.06);if(G.fever<=0)spawnBeam();}
}

/* ---------- events ---------- */
function burst(x,y,color,n,sp=4,size=3){for(let i=0;i<n;i++){const a=Math.random()*6.283,v=rnd(0.3,1)*sp*60*U;G.parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:rnd(0.35,0.8),max:0.8,color,s:size*U*rnd(0.6,1.4)});}}
function say(text,x,y,size,color){G.texts.push({text,x,y,size:size*U,color,t:0});}
function collectGem(g){
  g.dead=true;G.gems++;G.combo++;G.maxCombo=Math.max(G.maxCombo,G.combo);
  const nm=1+Math.min(7,Math.floor(G.combo/8));
  if(nm>G.mult){say("x"+nm+"!",F/2,H*0.42,46,"#ffd166");sfx("mult");G.flash=0.25;G.flashC="#ffd166";}
  G.mult=nm;
  const pts=10*G.mult*(G.fever>0?2:1);G.score+=pts;
  say("+"+pts,g.x,g.y-14*U,16,"#bff6ff");burst(g.x,g.y,"#5fe6ff",8,3,3);sfx("gem",G.combo);
  if(G.fever<=0){G.feverCharge=Math.min(1,G.feverCharge+1/28);if(G.feverCharge>=1)startFever();}
}
function startFever(){
  G.fever=5.5;G.fevers++;G.feverCharge=0;G.flash=0.6;G.flashC="#ff7a45";G.shake=10;
  G.ents.forEach(e=>{if(e.k==="met"){e.dead=true;burst(e.x,e.y,"#ff9f5a",10,4,3);spawnGem(e.x,e.y,V()*0.8);}if(e.k==="beam")e.dead=true;});
  say("FEUER-MODUS!",F/2,H*0.38,40,"#ff9f5a");sfx("fever");buzz([30,40,30]);
}
function nearMiss(e){
  G.near++;const pts=25*G.mult;G.score+=pts;G.hitStop=0.09;
  say("Knapp! +"+pts,G.p.x,G.p.y-40*U,20,"#ffd166");sfx("near");
  if(G.fever<=0){G.feverCharge=Math.min(1,G.feverCharge+0.07);if(G.feverCharge>=1)startFever();}
}
function hit(e){
  if(G.invul>0)return;
  if(G.fever>0&&e.k==="met"){e.dead=true;spawnGem(e.x,e.y,0);return;}
  if(G.shield>0){
    G.shield=0;G.invul=0.8;if(e.k==="met")e.dead=true;
    burst(G.p.x,G.p.y,"#8ff0ff",26,6,4);G.shake=12;G.flash=0.3;G.flashC="#8ff0ff";say("Schild weg!",G.p.x,G.p.y-40*U,20,"#8ff0ff");sfx("shield");buzz(60);return;
  }
  die();
}
function die(){
  G.state="dying";G.dieT=1;G.shake=22;G.flash=0.5;G.flashC="#ff4d6d";
  const c=skinColors();burst(G.p.x,G.p.y,c[1],50,9,5);burst(G.p.x,G.p.y,c[2],30,6,4);burst(G.p.x,G.p.y,"#fff",15,4,3);
  sfx("boom");buzz([80,40,160]);$("#bPause").hidden=true;
}
function gainPower(p){
  p.dead=true;burst(p.x,p.y,"#fff",14,4,3);sfx("power");
  if(p.type==="shield"){G.shield=1;say("Schild!",p.x,p.y,22,"#8ff0ff");}
  if(p.type==="magnet"){G.power.magnet=7;say("Magnet!",p.x,p.y,22,"#ff8fd8");}
  if(p.type==="slow"){G.power.slow=4.5;say("Zeitlupe!",p.x,p.y,22,"#b7a2ff");}
}
function checkMissions(){
  const val={gems:G.gems,survive:Math.floor(G.t),near:G.near,combo:G.maxCombo,fever:G.fevers,score:Math.floor(G.score)};
  G.act.forEach((m,i)=>{
    if(m.done||val[m.type]<target(m))return;
    m.done=true;const rw=reward(m);save.crystals+=rw;
    save.tiers[m.type]=(save.tiers[m.type]||0)+1;
    save.missions[i]=newMission(save.missions.map(x=>x.type));persist();
    toast("Mission erfüllt! +"+rw+" Kristalle");sfx("mission");
  });
}
let toastT=null;
function toast(msg){const old=$("#toast");if(old)old.remove();const d=document.createElement("div");d.id="toast";d.textContent=msg;$("#app").appendChild(d);clearTimeout(toastT);toastT=setTimeout(()=>d.remove(),2300);}

/* ---------- update ---------- */
function update(dt){
  if(!G)return;
  const playing=G.state==="play",dying=G.state==="dying";
  let ts=1;if(G.power.slow>0)ts*=0.55;if(dying)ts=0.3;if(G.hitStop>0){G.hitStop-=dt;ts*=0.12;}
  const d=dt*ts;
  const sp=(playing||dying)?speedF():0.4;
  stars.forEach(s=>{s.y+=d*s.z*0.35*sp*(G.fever>0?1.8:1);if(s.y>1){s.y-=1;s.x=Math.random();}});
  if(playing){
    G.t+=d;G.score+=d*8*speedF()*(G.fever>0?2:1);
    G.power.magnet=Math.max(0,G.power.magnet-dt);G.power.slow=Math.max(0,G.power.slow-dt);G.invul=Math.max(0,G.invul-dt);
    if(G.fever>0){G.fever-=dt;if(G.fever<=0)say("Feuer aus",F/2,H*0.4,22,"#ffb38a");}
    const p=G.p;
    if(keys.l)p.tx-=dt*620*U;if(keys.r)p.tx+=dt*620*U;
    p.tx=Math.min(Math.max(p.tx,p.r),F-p.r);
    p.x+=(p.tx-p.x)*Math.min(1,dt*22);
    spawn(d);
    if((G.misT-=dt)<=0){G.misT=0.25;checkMissions();}
  }
  const p=G.p;
  p.trail.unshift({x:p.x,y:p.y});p.trail.forEach(q=>q.y+=d*V()*0.9);if(p.trail.length>16)p.trail.length=16;
  for(const e of G.ents){
    if(e.dead)continue;
    if(e.k==="beam"){if(e.warn>0)e.warn-=d;else{e.life-=d;if(playing&&Math.abs(G.p.x-e.x)<e.w/2+G.p.r*0.5)hit(e);}if(e.life<=0)e.dead=true;continue;}
    e.y+=e.vy*d;
    if(e.type==="zig"){e.ph+=d*3;e.x=e.bx+Math.sin(e.ph)*e.amp;e.x=Math.min(Math.max(e.x,e.r),F-e.r);}
    if(e.rot!=null)e.rot+=e.vr*d;
    if(e.k==="gem"){e.ph+=d*6;if(e.vy<V()*0.88)e.vy+=d*V()*2;}
    if(!playing){if(e.y>H+80*U)e.dead=true;continue;}
    const dx=e.x-p.x,dy=e.y-p.y,dist=Math.hypot(dx,dy);
    if(e.k==="met"){
      if(Math.abs(dy)<e.r+p.r+30*U)e.minD=Math.min(e.minD,dist-e.r-p.r);
      if(dist<e.r+p.r*0.75){hit(e);if(G.state!=="play")break;continue;}
      if(!e.passed&&e.y-e.r>p.y+p.r){e.passed=true;if(e.minD<20*U&&G.invul<=0)nearMiss(e);}
    }else if(e.k==="gem"){
      if(G.power.magnet>0&&dist<190*U){e.x-=dx*Math.min(1,d*9);e.y-=dy*Math.min(1,d*9);}
      if(dist<e.r+p.r+6*U){collectGem(e);continue;}
      if(e.y>H+20*U){e.dead=true;if(G.fever<=0&&G.combo>=5){say("Combo verloren",F/2,H*0.5,20,"#ff8ea3");sfx("lose");}if(G.fever<=0){G.combo=0;G.mult=1;}}
    }else if(e.k==="pow"){

    }

  }

  G.parts=G.parts.filter(q=>{q.life-=dt;q.x+=q.vx*dt;q.y+=q.vy*dt;q.vx*=0.96;q.vy*=0.96;return q.life>0;});

  if(dying&&(G.dieT-=dt)<=0)gameOver();
}

/* ---------- loop ---------- */
let last=performance.now(),paused=false;
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;
  if(!paused){update(dt);music();}
  render(now);requestAnimationFrame(frame);
}

function muteIcon(){$("#bMute").innerHTML=save.mute?'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M17 9l4 6M21 9l-4 6"/></svg>':'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16.5 8.5a5 5 0 010 7M19 6a8.5 8.5 0 010 12"/></svg>';$("#bMute").setAttribute("aria-label",save.mute?"Ton an":"Ton aus");}

/* ---------- audio ---------- */
let ac=null,noise=null,master=null,nextBeat=0,beat=0;
function unlockAudio(){
  if(!ac){try{ac=new(window.AudioContext||window.webkitAudioContext)();master=ac.createGain();master.gain.value=0.8;master.connect(ac.destination);
    noise=ac.createBuffer(1,ac.sampleRate*0.5,ac.sampleRate);const d=noise.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}catch(e){}}
  if(ac&&ac.state==="suspended")ac.resume();
}
function tone(f,dur,type="sine",vol=0.1,delay=0,f2){
  if(!ac||save.mute)return;const t=ac.currentTime+delay,o=ac.createOscillator(),g=ac.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g).connect(master);o.start(t);o.stop(t+dur+0.02);
}
function hiss(dur,vol,freq=6000,delay=0,at){
  if(!ac||save.mute)return;const t=at??ac.currentTime+delay,s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();
  s.buffer=noise;f.type="highpass";f.frequency.value=freq;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  s.connect(f).connect(g).connect(master);s.start(t);s.stop(t+dur);
}
const semi=(b,n)=>b*Math.pow(2,n/12);
const SCALE=[0,2,4,7,9,12,14,16,19,21,24];
function sfx(k,n=0){
  if(k==="gem")tone(semi(660,SCALE[Math.min(n-1,30)%SCALE.length]+12*Math.floor(Math.min(n-1,21)/SCALE.length)),0.12,"sine",0.09);
  if(k==="near"){hiss(0.25,0.12,2500);tone(900,0.2,"triangle",0.05,0,1500);}
  if(k==="mult")[0,4,7,12].forEach((s,i)=>tone(semi(523,s),0.15,"square",0.04,i*0.05));
  if(k==="fever"){tone(200,0.6,"sawtooth",0.07,0,1200);[0,4,7,12,16].forEach((s,i)=>tone(semi(523,s),0.2,"triangle",0.08,0.1+i*0.06));}
  if(k==="power")[0,7,12].forEach((s,i)=>tone(semi(440,s),0.14,"triangle",0.08,i*0.05));
  if(k==="shield"){hiss(0.3,0.2,1200);tone(600,0.3,"square",0.05,0,200);}
  if(k==="boom"){hiss(0.8,0.35,300);tone(160,0.7,"sawtooth",0.12,0,35);}
  if(k==="warn")tone(880,0.12,"square",0.04),tone(880,0.12,"square",0.04,0.2);
  if(k==="lose")tone(330,0.18,"triangle",0.06,0,220);
  if(k==="mission")[0,4,7,12,16].forEach((s,i)=>tone(semi(659,s),0.16,"sine",0.08,i*0.07));
  if(k==="record")[0,4,7,12,7,12,16,19].forEach((s,i)=>tone(semi(523,s),0.2,"triangle",0.08,i*0.09));
  if(k==="start")tone(300,0.25,"triangle",0.08,0,900);
}
const BASS=[0,0,12,0,-2,-2,10,-2,-4,-4,8,-4,-5,-5,7,3];
function music(){
  if(!ac||save.mute||!G||G.state!=="play")return;
  const bpm=124+speedF()*16+(G.fever>0?20:0),step=60/bpm/2;
  if(nextBeat<ac.currentTime)nextBeat=ac.currentTime+0.02;
  while(nextBeat<ac.currentTime+0.12){
    const t=nextBeat,b=beat%16;
    if(b%4===0){const o=ac.createOscillator(),g=ac.createGain();o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(40,t+0.12);g.gain.setValueAtTime(0.22,t);g.gain.exponentialRampToValueAtTime(0.0001,t+0.16);o.connect(g).connect(master);o.start(t);o.stop(t+0.17);}
    if(b%2===1)hiss(0.04,G.fever>0?0.07:0.04,7000,0,t);
    const o=ac.createOscillator(),g=ac.createGain();o.type="triangle";o.frequency.value=semi(110,BASS[b]);g.gain.setValueAtTime(0.05,t);g.gain.exponentialRampToValueAtTime(0.0001,t+step*0.9);o.connect(g).connect(master);o.start(t);o.stop(t+step);
    if(G.fever>0&&b%2===0){const a=ac.createOscillator(),ag=ac.createGain();a.type="square";a.frequency.value=semi(440,[0,7,12,16][(b/2)%4]+BASS[b]);ag.gain.setValueAtTime(0.025,t);ag.gain.exponentialRampToValueAtTime(0.0001,t+step*0.8);a.connect(ag).connect(master);a.start(t);a.stop(t+step);}
    nextBeat+=step;beat++;
  }
}
function buzz(p){if(save.mute)return;try{navigator.vibrate&&navigator.vibrate(p);}catch(e){}}

/* ---------- boot ---------- */
resize();muteIcon();showMenu();
G=null;requestAnimationFrame(frame);
// idle background: a slow sky behind the menu
(function idle(){reset();G.state="menu";G.p.trail=[];})();
})();
