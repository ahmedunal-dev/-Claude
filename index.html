<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bahçe Blokları</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: one centered play column (status bar, square garden bed, seed tray, tool row); menus are sheets laid over it */
:root{
  --bg:#e7f0e1; --surface:#fbfdf8; --ink:#1c3426; --muted:#587061; --line:#cddcc8;
  --bed:#3a684d; --bed-cell:#477a5b; --leaf:#86c46f;
  --accent:#e9862a; --accent-ink:#ffffff; --petal:#fff7ea; --core:#f3b52f;
  --stone:#8e9690; --stone-dark:#5d645f;
  --b1:#ef6a5a; --b2:#f4b83c; --b3:#4ea7df; --b4:#9a79df; --b5:#45c196; --b6:#f08db2;
  --scrim:rgba(20,40,28,.45);
  --font-display:"Fredoka","Nunito",ui-rounded,system-ui,sans-serif;
  --font-body:"Nunito",ui-rounded,system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1b15; --surface:#18281f; --ink:#e3efe6; --muted:#9bb2a3; --line:#2b4236;
    --bed:#1e3b2c; --bed-cell:#29503b; --leaf:#5fa24d;
    --accent:#f4a54a; --accent-ink:#1b130a; --petal:#fff3df; --core:#f3b52f;
    --stone:#79817b; --stone-dark:#4b524d;
    --scrim:rgba(0,0,0,.6); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1b15; --surface:#18281f; --ink:#e3efe6; --muted:#9bb2a3; --line:#2b4236;
  --bed:#1e3b2c; --bed-cell:#29503b; --leaf:#5fa24d;
  --accent:#f4a54a; --accent-ink:#1b130a; --petal:#fff3df; --core:#f3b52f;
  --stone:#79817b; --stone-dark:#4b524d;
  --scrim:rgba(0,0,0,.6); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{min-height:100%;display:flex;flex-direction:column;align-items:center;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.col{width:100%;max-width:480px;display:flex;flex-direction:column;gap:12px}

/* menu */
.hero{display:flex;flex-direction:column;align-items:center;gap:14px;padding-block:20px 8px;text-align:center}
.art{display:grid;grid-template-columns:repeat(5,34px);gap:4px;padding:8px;background:var(--bed);border-radius:16px;transform:rotate(-3deg)}
.art span{width:34px;height:34px;border-radius:8px;background:var(--bed-cell)}
.art span.f{background:var(--leaf);display:grid;place-items:center}
h1{font-family:var(--font-display);font-weight:700;font-size:clamp(2.4rem,11vw,3.4rem);line-height:1;margin:6px 0 0;letter-spacing:-.01em;text-wrap:balance}
.tag{margin:0;color:var(--muted);font-size:1.05rem;max-width:30ch;text-wrap:balance}
.menu-btns{display:flex;flex-direction:column;gap:10px;width:100%;max-width:340px;margin-inline:auto}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:56px;padding:0 20px;border-radius:16px;font-family:var(--font-display);font-weight:600;font-size:1.2rem;background:var(--surface);border:2px solid var(--line);transition:transform .08s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent;box-shadow:0 4px 0 color-mix(in srgb,var(--accent) 60%,#000)}
.btn small{font-family:var(--font-body);font-weight:700;font-size:.85rem;opacity:.8}
.stats{display:flex;justify-content:center;gap:18px;color:var(--muted);font-weight:700;font-size:.95rem;font-variant-numeric:tabular-nums}

/* top bar */
.bar{display:flex;align-items:center;gap:8px}
.icon-btn{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--surface);border:2px solid var(--line);flex:none}
.icon-btn svg{width:22px;height:22px}
.bar h2{flex:1;margin:0;font-family:var(--font-display);font-weight:600;font-size:1.3rem;text-align:center}
.hud{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pill{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:6px 8px;display:flex;flex-direction:column;align-items:center;min-width:0}
.pill .k{font-size:.72rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.pill .v{font-family:var(--font-display);font-weight:700;font-size:1.45rem;line-height:1.1;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:4px}
.pill .v svg{width:20px;height:20px}
.pill.warn .v{color:var(--b1)}
.bump{animation:bump .3s}
@keyframes bump{50%{transform:scale(1.25)}}
.stage{display:flex;justify-content:center}
canvas{display:block;touch-action:none;user-select:none;-webkit-user-select:none;max-width:100%}
.tools{display:flex;gap:10px;justify-content:center}
.tools .btn{min-height:48px;font-size:1.05rem;flex:1;max-width:220px}
.tools .btn.pulse{animation:pulse 1s infinite;border-color:var(--accent)}
@keyframes pulse{50%{transform:scale(1.05)}}
.tools .btn[disabled]{opacity:.45;cursor:default}

/* levels */
.lv-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.lv{aspect-ratio:1;max-width:100%;border-radius:14px;background:var(--surface);border:2px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-family:var(--font-display);font-weight:700;font-size:1.25rem}
.lv .st{font-size:.7rem;letter-spacing:1px;color:var(--core);line-height:1}
.lv.cur{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.lv[disabled]{opacity:.4;cursor:default}

/* sheets */
.sheet{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));z-index:20;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.card{background:var(--surface);border-radius:24px;padding:24px 20px;width:100%;max-width:380px;display:flex;flex-direction:column;gap:14px;text-align:center;animation:rise .25s ease-out}
@keyframes rise{from{transform:translateY(20px) scale(.96)}}
.card h3{margin:0;font-family:var(--font-display);font-size:1.9rem;font-weight:700;text-wrap:balance}
.card p{margin:0;color:var(--muted);font-size:1.05rem}
.stars{display:flex;justify-content:center;gap:6px}
.stars svg{width:52px;height:52px}
.stars svg.on{animation:pop .4s backwards}
@keyframes pop{from{transform:scale(0)}}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px;text-align:left}
.steps li{display:flex;gap:12px;align-items:flex-start;font-size:1.02rem;line-height:1.4}
.steps b.n{flex:none;width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--font-display)}
.note{font-size:.92rem;color:var(--muted);text-align:left;margin:0}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app"><div class="col">

  <!-- MENU -->
  <section id="menu">
    <div class="hero">
      <div class="art" id="art" aria-hidden="true"></div>
      <h1>Bahçe Blokları</h1>
      <p class="tag">Blokları yerleştir, sırayı doldur, çiçekleri topla.</p>
    </div>
    <div class="menu-btns">
      <button class="btn primary" id="bPlay">Oyna <small id="playLv">Bölüm 1</small></button>
      <button class="btn" id="bLevels">Bölümler</button>
      <button class="btn" id="bFree">Serbest Bahçe <small>sonsuz</small></button>
      <button class="btn" id="bHow">Nasıl oynanır?</button>
    </div>
    <div class="stats" style="margin-top:18px"><span id="sStars">0 yıldız</span><span id="sBest">Rekor 0</span></div>
  </section>

  <!-- LEVEL SELECT -->
  <section id="levels" hidden>
    <div class="col">
      <div class="bar">
        <button class="icon-btn" data-go="menu" aria-label="Geri"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
        <h2>Bölümler</h2>
        <span style="width:44px"></span>
      </div>
      <div class="lv-grid" id="lvGrid"></div>
    </div>
  </section>

  <!-- GAME -->
  <section id="game" hidden>
    <div class="col">
      <div class="bar">
        <button class="icon-btn" id="bBack" aria-label="Menü"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
        <h2 id="gTitle">Bölüm 1</h2>
        <button class="icon-btn" id="bMute" aria-label="Ses"></button>
      </div>
      <div class="hud">
        <div class="pill" id="pGoal"><span class="k" id="kGoal">Çiçek</span><span class="v" id="vGoal"></span></div>
        <div class="pill" id="pMoves"><span class="k">Hamle</span><span class="v" id="vMoves">∞</span></div>
        <div class="pill"><span class="k">Puan</span><span class="v" id="vScore">0</span></div>
      </div>
      <div class="stage" id="stage"><canvas id="cv"></canvas></div>
      <div class="tools">
        <button class="btn" id="bShuffle">Karıştır <small id="shN">2</small></button>
        <button class="btn" id="bRestart">Baştan</button>
      </div>
    </div>
  </section>
</div></div>

<div class="sheet" id="sheet" hidden><div class="card" id="card"></div></div>

<script>
(()=>{
"use strict";
const N=8;
const $=s=>document.querySelector(s);
const SAVE_KEY="bahce-bloklari-v1";
let save={unlocked:1,stars:{},best:0,mute:false};
try{const raw=localStorage.getItem(SAVE_KEY);if(raw)save=Object.assign(save,JSON.parse(raw));}catch(e){}
function persist(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(save));}catch(e){}}

/* ---------- shapes ---------- */
function parse(str){const rows=str.split("/");const cells=[];rows.forEach((row,r)=>[...row].forEach((ch,c)=>{if(ch==="X")cells.push([r,c]);}));return{cells,h:rows.length,w:Math.max(...rows.map(x=>x.length))};}
const EASY=["X","XX","X/X","XXX","X/X/X","XX/XX","XX/X.","XX/.X","X./XX",".X/XX"].map(parse);
const MID=["XXXX","X/X/X/X","X../XXX","..X/XXX","XXX/X..","XXX/..X","XX/X./X.","XX/.X/.X","X./X./XX",".X/.X/XX","XXX/.X.",".X./XXX","X./XX/X.",".X/XX/.X","XX./.XX",".XX/XX.","X./XX/.X",".X/XX/X.","XXX/XXX","XX/XX/XX"].map(parse);
const HARD=["XXXXX","X/X/X/X/X","XXX/XXX/XXX","XXX/X../X..","XXX/..X/..X","X../X../XXX","..X/..X/XXX","X.X/XXX","XXX/X.X","X./X./X./XX"].map(parse);
const ONE=EASY[0];

function rng(seed){let s=seed>>>0||1;return()=>{s=(s+0x6D2B79F5)>>>0;let t=s;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296;};}

/* ---------- game state ---------- */
let S=null;
const newGrid=()=>Array.from({length:N},()=>Array(N).fill(null));
function levelConfig(n){
  const flowers=Math.min(3+Math.floor((n-1)*1.25),20);
  const stones=n<4?0:Math.min(Math.floor((n-2)/2),12);
  const clutter=n<6?0:Math.min(Math.floor((n-4)*1.1),14);
  const moves=n<8?null:Math.max(18,Math.round(14+flowers*1.9+stones*1.1-Math.min(n-8,30)*0.3));
  const hard=Math.min((n-1)/35,1);
  return{flowers,stones,clutter,moves,hard};
}
function fullLines(g){
  const rows=[],cols=[];
  for(let r=0;r<N;r++)if(g[r].every(Boolean))rows.push(r);
  for(let c=0;c<N;c++){let ok=true;for(let r=0;r<N;r++)if(!g[r][c]){ok=false;break;}if(ok)cols.push(c);}
  return{rows,cols};
}
function startLevel(n){
  const cfg=levelConfig(n),R=rng(n*7919+13),g=newGrid();
  const free=()=>{let r,c,t=0;do{r=Math.floor(R()*N);c=Math.floor(R()*N);t++;}while(g[r][c]&&t<300);return[r,c];};
  for(let i=0;i<cfg.stones;i++){const[r,c]=free();g[r][c]={c:-1,s:2};}
  for(let i=0;i<cfg.flowers;i++){const[r,c]=free();g[r][c]={c:0,f:1};}
  for(let i=0;i<cfg.clutter;i++){const[r,c]=free();g[r][c]={c:1+Math.floor(R()*6)};}
  // never start with a full line
  for(let guard=0;guard<50;guard++){
    const{rows,cols}=fullLines(g);if(!rows.length&&!cols.length)break;
    const cells=rows.length?g[rows[0]].map((x,c)=>[rows[0],c]):g.map((x,r)=>[r,cols[0]]);
    const pick=cells.find(([r,c])=>!g[r][c].f)||cells[0];
    if(g[pick[0]][pick[1]].f)cfg.flowers--;
    g[pick[0]][pick[1]]=null;
  }
  let flowers=0;g.forEach(row=>row.forEach(x=>{if(x&&x.f)flowers++;}));
  S={mode:"level",level:n,grid:g,tray:[],score:0,combo:0,miss:0,flowersLeft:flowers,flowersTotal:flowers,
     movesLeft:cfg.moves,movesUsed:0,shuffles:2,hard:cfg.hard,over:false,
     budget:cfg.moves||Math.round(flowers*2.2+cfg.stones+10)};
  fillTray();enterGame();
}
function startFree(){
  S={mode:"free",grid:newGrid(),tray:[],score:0,combo:0,miss:0,flowersLeft:0,flowersTotal:0,movesLeft:null,movesUsed:0,shuffles:1,hard:0,over:false};
  fillTray();enterGame();
}
const curHard=()=>S.mode==="level"?S.hard:Math.min(S.score/5000,1);
function pickShape(h){
  const we=1-0.55*h,wm=0.45+0.35*h,wh=0.06+0.45*h;
  const x=Math.random()*(we+wm+wh);
  const pool=x<we?EASY:(x<we+wm?MID:HARD);
  const s=pool[Math.floor(Math.random()*pool.length)];
  return{cells:s.cells,w:s.w,h:s.h,color:1+Math.floor(Math.random()*6)};
}
function canFit(p,r0,c0,g=S.grid){
  for(const[r,c]of p.cells){const rr=r0+r,cc=c0+c;if(rr<0||cc<0||rr>=N||cc>=N||g[rr][cc])return false;}
  return true;
}
function fitsAnywhere(p,g=S.grid){for(let r=0;r<=N-p.h;r++)for(let c=0;c<=N-p.w;c++)if(canFit(p,r,c,g))return true;return false;}
function fillTray(strict){
  strict=strict||(S.mode==="level"&&S.level<=5);
  let t;
  for(let a=0;a<40;a++){
    t=[0,1,2].map(()=>pickShape(curHard()));
    if(strict?t.every(p=>fitsAnywhere(p)):t.some(p=>fitsAnywhere(p)))break;
  }
  if(!t.some(p=>fitsAnywhere(p))&&S.grid.some(r=>r.some(x=>!x)))t[0]={cells:ONE.cells,w:1,h:1,color:2};
  S.tray=t;
}

/* ---------- canvas ---------- */
const cv=$("#cv"),ctx=cv.getContext("2d"),stage=$("#stage");
let G={},C={},dpr=1,drag=null,fx=[],parts=[],texts=[],shake=0;
function readColors(){
  const cs=getComputedStyle(document.documentElement);
  ["bed","bed-cell","leaf","petal","core","stone","stone-dark","accent","ink","b1","b2","b3","b4","b5","b6"].forEach(k=>C[k]=cs.getPropertyValue("--"+k).trim());
  C.blocks=[C.leaf,C.b1,C.b2,C.b3,C.b4,C.b5,C.b6];
}
function resize(){
  if($("#game").hidden)return;
  const availH=window.innerHeight-230;
  const w=Math.max(240,Math.min(stage.clientWidth,480,availH/1.43));
  const pad=Math.round(w*0.03),cell=Math.floor((w-pad*2)/N);
  G={w,pad,cell,bx:Math.round((w-cell*N)/2),by:pad,trayY:pad+cell*N+Math.round(cell*0.45),trayH:Math.round(cell*2.9)};
  G.h=G.trayY+G.trayH+Math.round(pad*0.5);
  dpr=Math.min(window.devicePixelRatio||1,3);
  cv.style.width=w+"px";cv.style.height=G.h+"px";
  cv.width=Math.round(w*dpr);cv.height=Math.round(G.h*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  readColors();
}
window.addEventListener("resize",resize);
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change",readColors);
new MutationObserver(readColors).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});

function rrect(x,y,w,h,r){ctx.beginPath();if(ctx.roundRect)ctx.roundRect(x,y,w,h,r);else{ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}}
function block(x,y,s,color,alpha=1){
  const i=s*0.05,z=s-i*2;ctx.save();ctx.globalAlpha=alpha;rrect(x+i,y+i,z,z,s*0.2);ctx.clip();
  ctx.fillStyle=color;ctx.fillRect(x,y,s,s);
  ctx.fillStyle="rgba(0,0,0,.17)";ctx.fillRect(x,y+i+z*0.8,s,s);
  ctx.fillStyle="rgba(255,255,255,.3)";rrect(x+i+z*0.14,y+i+z*0.12,z*0.42,z*0.16,z*0.08);ctx.fill();
  ctx.restore();
}
function flower(x,y,s,alpha=1){
  block(x,y,s,C.leaf,alpha);
  const cx=x+s/2,cy=y+s*0.47;ctx.save();ctx.globalAlpha=alpha;ctx.fillStyle=C.petal;
  for(let k=0;k<5;k++){const a=k*Math.PI*2/5-Math.PI/2;ctx.beginPath();ctx.arc(cx+Math.cos(a)*s*0.17,cy+Math.sin(a)*s*0.17,s*0.13,0,7);ctx.fill();}
  ctx.fillStyle=C.core;ctx.beginPath();ctx.arc(cx,cy,s*0.11,0,7);ctx.fill();ctx.restore();
}
function stone(x,y,s,hp){
  block(x,y,s,C.stone);
  ctx.save();ctx.fillStyle=C["stone-dark"];
  [[.3,.35,.06],[.62,.3,.045],[.55,.62,.07],[.3,.66,.04]].forEach(([a,b,r])=>{ctx.beginPath();ctx.arc(x+s*a,y+s*b,s*r,0,7);ctx.fill();});
  if(hp<2){ctx.strokeStyle=C["stone-dark"];ctx.lineWidth=Math.max(2,s*0.06);ctx.lineCap="round";ctx.beginPath();ctx.moveTo(x+s*.22,y+s*.2);ctx.lineTo(x+s*.45,y+s*.45);ctx.lineTo(x+s*.38,y+s*.62);ctx.lineTo(x+s*.6,y+s*.82);ctx.moveTo(x+s*.45,y+s*.45);ctx.lineTo(x+s*.75,y+s*.4);ctx.stroke();}
  ctx.restore();
}
function drawCell(cell,x,y,s,alpha=1){
  if(cell.s)stone(x,y,s,cell.s);else if(cell.f)flower(x,y,s,alpha);else block(x,y,s,C.blocks[cell.c],alpha);
}
const cellXY=(r,c)=>({x:G.bx+c*G.cell,y:G.by+r*G.cell});
const traySlot=i=>({cx:(i+0.5)*G.w/3,cy:G.trayY+G.trayH/2});

function preview(){
  if(!drag||!drag.target)return null;
  const g=S.grid.map(r=>r.slice());
  for(const[r,c]of drag.p.cells)g[drag.target.r0+r][drag.target.c0+c]={c:drag.p.color};
  return fullLines(g);
}
function draw(now){
  ctx.clearRect(0,0,G.w,G.h);
  let ox=0,oy=0;if(shake>0){ox=(Math.random()-.5)*shake;oy=(Math.random()-.5)*shake;shake*=0.85;if(shake<.3)shake=0;}
  ctx.save();ctx.translate(ox,oy);
  const m=G.cell*0.14;ctx.fillStyle=C.bed;rrect(G.bx-m,G.by-m,G.cell*N+m*2,G.cell*N+m*2,G.cell*0.35);ctx.fill();
  const pv=preview();
  const hl=new Set();if(pv){pv.rows.forEach(r=>{for(let c=0;c<N;c++)hl.add(r*N+c);});pv.cols.forEach(c=>{for(let r=0;r<N;r++)hl.add(r*N+c);});}
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){
    const{x,y}=cellXY(r,c),cell=S.grid[r][c],s=G.cell;
    if(cell)drawCell(cell,x,y,s);
    else{ctx.fillStyle=C["bed-cell"];rrect(x+s*0.06,y+s*0.06,s*0.88,s*0.88,s*0.18);ctx.fill();}
  }
  if(drag&&drag.target){
    for(const[r,c]of drag.p.cells){const{x,y}=cellXY(drag.target.r0+r,drag.target.c0+c);block(x,y,G.cell,C.blocks[drag.p.color],0.45);}
  }
  if(hl.size){ctx.save();ctx.fillStyle="rgba(255,255,255,"+(0.22+0.1*Math.sin(now/120))+")";hl.forEach(k=>{const{x,y}=cellXY(k/N|0,k%N);rrect(x+G.cell*0.05,y+G.cell*0.05,G.cell*0.9,G.cell*0.9,G.cell*0.2);ctx.fill();});ctx.restore();}
  // clearing cells
  fx=fx.filter(f=>{const t=(now-f.t0)/320;if(t>=1)return false;const s=G.cell*(1-t*0.7),o=(G.cell-s)/2;ctx.save();ctx.globalAlpha=1-t;drawCell(f.cell,f.x+o,f.y+o,s);ctx.restore();return true;});
  ctx.restore();
  // tray
  S.tray.forEach((p,i)=>{
    if(!p||(drag&&drag.i===i))return;
    const sc=G.cell*0.5,{cx,cy}=traySlot(i),x0=cx-p.w*sc/2,y0=cy-p.h*sc/2,ok=fitsAnywhere(p);
    for(const[r,c]of p.cells)block(x0+c*sc,y0+r*sc,sc,C.blocks[p.color],ok?1:0.3);
  });
  if(drag){
    const s=G.cell,x0=drag.x-drag.p.w*s/2,y0=drag.y-drag.lift-drag.p.h*s/2;
    for(const[r,c]of drag.p.cells)block(x0+c*s,y0+r*s,s,C.blocks[drag.p.color],0.95);
  }
  // particles
  parts=parts.filter(p=>{p.life-=1/60;if(p.life<=0)return false;p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;ctx.save();ctx.globalAlpha=Math.min(1,p.life*2);ctx.fillStyle=p.color;
    if(p.petal){ctx.beginPath();ctx.ellipse(p.x,p.y,p.r,p.r*0.6,p.x/20,0,7);ctx.fill();}else{ctx.fillRect(p.x-p.r/2,p.y-p.r/2,p.r,p.r);}
    ctx.restore();return true;});
  texts=texts.filter(t=>{const k=(now-t.t0)/1100;if(k>=1)return false;ctx.save();ctx.globalAlpha=k<.7?1:1-(k-.7)/.3;
    ctx.font="700 "+t.size+"px Fredoka, Nunito, sans-serif";ctx.textAlign="center";ctx.textBaseline="middle";
    const y=t.y-k*G.cell*1.2;ctx.lineWidth=5;ctx.strokeStyle="rgba(0,0,0,.35)";ctx.strokeText(t.text,t.x,y);ctx.fillStyle=t.color||"#fff";ctx.fillText(t.text,t.x,y);ctx.restore();return true;});
}
function loop(now){if(S&&!$("#game").hidden&&G.cell)draw(now);requestAnimationFrame(loop);}
requestAnimationFrame(loop);

function burst(x,y,color,n=7,petal=false){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,v=1+Math.random()*3.2;parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-1.5,g:0.15,r:G.cell*(petal?0.14:0.12)*(0.6+Math.random()*0.6),life:0.6+Math.random()*0.4,color,petal});}}
function say(text,x,y,size,color){texts.push({text,x,y,size:size||G.cell*0.6,color,t0:performance.now()});}

/* ---------- input ---------- */
function pos(e){const b=cv.getBoundingClientRect();return{x:(e.clientX-b.left)*G.w/b.width,y:(e.clientY-b.top)*G.h/b.height};}
function updateTarget(){
  const p=drag.p,left=drag.x-p.w*G.cell/2,top=drag.y-drag.lift-p.h*G.cell/2;
  const c0=Math.round((left-G.bx)/G.cell),r0=Math.round((top-G.by)/G.cell);
  drag.target=canFit(p,r0,c0)?{r0,c0}:null;
}
cv.addEventListener("pointerdown",e=>{
  unlockAudio();if(!S||S.over||!$("#sheet").hidden)return;
  const{x,y}=pos(e);if(y<G.trayY-G.cell*0.3)return;
  const i=Math.max(0,Math.min(2,Math.floor(x/(G.w/3)))),p=S.tray[i];if(!p)return;
  drag={i,p,x,y,lift:e.pointerType==="mouse"?0:G.cell*1.8,target:null};
  try{cv.setPointerCapture(e.pointerId);}catch(_){}
  updateTarget();tone(330,.05,"triangle",.06);
});
cv.addEventListener("pointermove",e=>{if(!drag)return;const q=pos(e);drag.x=q.x;drag.y=q.y;updateTarget();});
const end=e=>{if(!drag)return;const d=drag;drag=null;if(e.type==="pointerup"&&d.target)place(d.i,d.target.r0,d.target.c0);};
cv.addEventListener("pointerup",end);cv.addEventListener("pointercancel",end);

/* ---------- rules ---------- */
const PRAISE=["","","Harika!","Süper!","Muhteşem!","İnanılmaz!"];
function place(i,r0,c0){
  const p=S.tray[i];
  for(const[r,c]of p.cells)S.grid[r0+r][c0+c]={c:p.color};
  S.tray[i]=null;S.movesUsed++;if(S.movesLeft!=null)S.movesLeft--;
  let gain=p.cells.length;sfx("place");buzz(10);
  const{rows,cols}=fullLines(S.grid),lines=rows.length+cols.length;
  if(lines){
    S.combo++;S.miss=0;
    const keys=new Set();rows.forEach(r=>{for(let c=0;c<N;c++)keys.add(r*N+c);});cols.forEach(c=>{for(let r=0;r<N;r++)keys.add(r*N+c);});
    const t0=performance.now();let got=0;
    keys.forEach(k=>{
      const r=k/N|0,c=k%N,cell=S.grid[r][c],{x,y}=cellXY(r,c),mx=x+G.cell/2,my=y+G.cell/2;
      if(cell.s){cell.s--;burst(mx,my,C.stone,6);if(cell.s<=0){fx.push({cell:{c:-1,s:1},x,y,t0});S.grid[r][c]=null;gain+=15;}return;}
      if(cell.f){S.flowersLeft--;got++;burst(mx,my,C.petal,10,true);burst(mx,my,C.core,4);}
      else burst(mx,my,C.blocks[cell.c],4);
      fx.push({cell,x,y,t0});S.grid[r][c]=null;
    });
    const add=Math.round(lines*lines*20*(1+0.5*(S.combo-1)));gain+=add;
    const cx=G.bx+(c0+p.w/2)*G.cell,cy=G.by+(r0+p.h/2)*G.cell;
    say("+"+add,cx,cy,G.cell*0.7,C.core);
    if(lines>=2)say(PRAISE[Math.min(lines,5)],G.w/2,G.by+G.cell*3.5,G.cell*0.95,"#fff");
    else if(S.combo>=2)say("Seri x"+S.combo,G.w/2,G.by+G.cell*3.5,G.cell*0.85,"#fff");
    shake=Math.min(4+lines*3,14);
    sfx("clear",lines,S.combo);if(got)setTimeout(()=>sfx("flower"),120);buzz([20,30,20]);
    if(got)bumpEl("#pGoal");
    if(S.grid.every(r=>r.every(x=>!x))){gain+=300;say("Tertemiz! +300",G.w/2,G.by+G.cell*5,G.cell*0.75,C.core);}
  }else{S.miss++;if(S.miss>=3)S.combo=0;}
  S.score+=gain;
  if(S.mode==="free"&&S.score>save.best){save.best=S.score;persist();}
  hud();
  if(S.mode==="level"&&S.flowersLeft<=0){setTimeout(win,450);S.over=true;return;}
  if(S.tray.every(x=>!x))fillTray();
  if(S.mode==="level"&&S.movesLeft!=null&&S.movesLeft<=0){S.over=true;setTimeout(()=>lose("moves"),400);return;}
  checkStuck();
}
function checkStuck(){
  const rem=S.tray.filter(Boolean);
  const stuck=rem.length&&!rem.some(p=>fitsAnywhere(p));
  $("#bShuffle").classList.toggle("pulse",!!stuck&&S.shuffles>0);
  if(!stuck)return;
  if(S.shuffles>0){
    sheet(`<h3>Sıkıştın!</h3><p>Hiçbir parça sığmıyor. Karıştırarak yeni parçalar alabilirsin.</p>
      <button class="btn primary" data-act="shuffle">Karıştır <small>${S.shuffles} hak</small></button>
      <button class="btn" data-act="giveup">Pes et</button>`);
  }else{S.over=true;setTimeout(()=>S.mode==="free"?freeOver():lose("stuck"),350);}
}
function shuffle(){
  if(!S||S.over||S.shuffles<=0)return;
  S.shuffles--;fillTray(true);sfx("shuffle");closeSheet();hud();checkStuck();
}
function starsFor(){const used=S.movesUsed/S.budget;return used<=0.6?3:used<=0.85?2:1;}
function win(){
  const n=S.level,st=starsFor();
  save.stars[n]=Math.max(save.stars[n]||0,st);save.unlocked=Math.max(save.unlocked,n+1);persist();
  sfx("win");confetti();
  const starSvg=on=>`<svg viewBox="0 0 24 24" class="${on?"on":""}" style="animation-delay:${0}s"><path d="M12 2.5l2.9 6 6.6.8-4.9 4.6 1.3 6.5L12 17.2l-5.9 3.2 1.3-6.5L2.5 9.3l6.6-.8z" fill="${on?"var(--core)":"var(--line)"}"/></svg>`;
  const stars=[1,2,3].map(k=>starSvg(k<=st).replace('animation-delay:0s','animation-delay:'+(k*0.15)+'s')).join("");
  sheet(`<div class="stars">${stars}</div><h3>Bölüm ${n} tamam!</h3>
    <p>${S.flowersTotal} çiçeği ${S.movesUsed} hamlede topladın. Puan: ${S.score}</p>
    <button class="btn primary" data-act="next">Sonraki bölüm</button>
    <button class="btn" data-act="levels">Bölümler</button>`);
}
function lose(why){
  sfx("fail");
  sheet(`<h3>Az kaldı!</h3><p>${why==="moves"?"Hamlelerin bitti.":"Parçalar artık sığmıyor."} ${S.flowersLeft} çiçek kaldı.</p>
    <button class="btn primary" data-act="retry">Tekrar dene</button>
    <button class="btn" data-act="levels">Bölümler</button>`);
}
function freeOver(){
  sfx("fail");const rec=S.score>=save.best&&S.score>0;
  sheet(`<h3>${rec?"Yeni rekor!":"Bahçe doldu"}</h3><p>Puanın: <b>${S.score}</b><br>Rekorun: ${save.best}</p>
    <button class="btn primary" data-act="free">Yeniden oyna</button>
    <button class="btn" data-act="menu">Ana menü</button>`);
}
function confetti(){const cols=C.blocks.slice(1);for(let i=0;i<70;i++)parts.push({x:Math.random()*G.w,y:-10-Math.random()*60,vx:(Math.random()-.5)*2,vy:Math.random()*2,g:0.06,r:G.cell*0.16,life:1.6+Math.random(),color:cols[i%cols.length],petal:i%2===0});}

/* ---------- UI ---------- */
const FLOWER_ICON=`<svg viewBox="0 0 24 24"><g fill="var(--b6)">${[0,1,2,3,4].map(k=>{const a=k*Math.PI*2/5-Math.PI/2;return`<circle cx="${(12+Math.cos(a)*5.5).toFixed(1)}" cy="${(12+Math.sin(a)*5.5).toFixed(1)}" r="4.3"/>`;}).join("")}</g><circle cx="12" cy="12" r="3.4" fill="var(--core)"/></svg>`;
function hud(){
  if(!S)return;
  $("#gTitle").textContent=S.mode==="level"?"Bölüm "+S.level:"Serbest Bahçe";
  if(S.mode==="level"){$("#kGoal").textContent="Çiçek";$("#vGoal").innerHTML=FLOWER_ICON+Math.max(0,S.flowersLeft);}
  else{$("#kGoal").textContent="Rekor";$("#vGoal").textContent=save.best;}
  $("#vMoves").textContent=S.movesLeft==null?"∞":S.movesLeft;
  $("#pMoves").classList.toggle("warn",S.movesLeft!=null&&S.movesLeft<=5);
  $("#vScore").textContent=S.score;
  $("#shN").textContent=S.shuffles;$("#bShuffle").disabled=S.shuffles<=0;
}
function bumpEl(sel){const el=$(sel);el.classList.remove("bump");void el.offsetWidth;el.classList.add("bump");}
function show(id){["menu","levels","game"].forEach(k=>$("#"+k).hidden=k!==id);if(id==="menu")renderMenu();if(id==="levels")renderLevels();if(id==="game")resize();}
function enterGame(){drag=null;fx=[];parts=[];texts=[];closeSheet();show("game");hud();$("#bShuffle").classList.remove("pulse");}
function sheet(html){$("#card").innerHTML=html;$("#sheet").hidden=false;const b=$("#card .btn");b&&b.focus();}
function closeSheet(){$("#sheet").hidden=true;}
function renderMenu(){
  $("#playLv").textContent="Bölüm "+save.unlocked;
  const total=Object.values(save.stars).reduce((a,b)=>a+b,0);
  $("#sStars").textContent=total+" yıldız";$("#sBest").textContent="Rekor "+save.best;
}
function renderLevels(){
  const max=Math.max(30,Math.ceil((save.unlocked+5)/5)*5),g=$("#lvGrid");g.innerHTML="";
  for(let n=1;n<=max;n++){
    const b=document.createElement("button");b.className="lv"+(n===save.unlocked?" cur":"");
    const st=save.stars[n]||0;b.innerHTML=`${n}<span class="st">${n<save.unlocked?"★".repeat(st)+"☆".repeat(3-st):"&nbsp;"}</span>`;
    if(n>save.unlocked){b.disabled=true;b.setAttribute("aria-label","Bölüm "+n+" kilitli");}
    else b.onclick=()=>{unlockAudio();startLevel(n);};
    g.appendChild(b);
  }
}
(function art(){const pat="bbfb.,b..bc,fccbb,.b.f.".split(",");const cols=["var(--b1)","var(--b2)","var(--b3)","var(--b5)","var(--b4)"];let k=0;
  $("#art").innerHTML=pat.join("").split("").map((ch,i)=>ch==="f"?`<span class="f">${FLOWER_ICON.replace("<svg",'<svg width="26" height="26"').replace(/var\(--b6\)/,"var(--petal)")}</span>`:ch==="."?"<span></span>":`<span style="background:${cols[(k++)%5]}"></span>`).join("");})();

const MUTE_ON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M17 9l4 6M21 9l-4 6"/></svg>';
const MUTE_OFF='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16.5 8.5a5 5 0 010 7M19 6a8.5 8.5 0 010 12"/></svg>';
function muteIcon(){$("#bMute").innerHTML=save.mute?MUTE_ON:MUTE_OFF;$("#bMute").setAttribute("aria-label",save.mute?"Sesi aç":"Sesi kapat");}
muteIcon();

$("#bPlay").onclick=()=>{unlockAudio();startLevel(save.unlocked);};
$("#bLevels").onclick=()=>show("levels");
$("#bFree").onclick=()=>{unlockAudio();startFree();};
$("#bHow").onclick=()=>sheet(`<h3>Nasıl oynanır?</h3><ol class="steps">
  <li><b class="n">1</b><span>Alttaki parçalardan birini parmağınla sürükle, bahçeye bırak.</span></li>
  <li><b class="n">2</b><span>Bir satır ya da sütun tamamen dolunca temizlenir ve puan kazanırsın.</span></li>
  <li><b class="n">3</b><span>Çiçekli kareler temizlenince toplanır. Bütün çiçekleri topla, bölümü geç.</span></li></ol>
  <p class="note">Gri taşlar iki kez temizlenince kırılır. Soluk görünen parça şu an hiçbir yere sığmıyor demektir. Sıkışırsan Karıştır'a bas. Az hamlede bitirirsen 3 yıldız alırsın.</p>
  <button class="btn primary" data-act="close">Anladım</button>`);
document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>show(b.dataset.go));
$("#bBack").onclick=()=>{drag=null;show(S&&S.mode==="level"?"levels":"menu");};
$("#bMute").onclick=()=>{save.mute=!save.mute;persist();muteIcon();unlockAudio();};
$("#bShuffle").onclick=()=>{unlockAudio();shuffle();};
$("#bRestart").onclick=()=>{if(!S)return;sheet(`<h3>Baştan başlansın mı?</h3><p>Bu bölümdeki ilerlemen sıfırlanır.</p>
  <button class="btn primary" data-act="${S.mode==="level"?"retry":"free"}">Baştan başla</button><button class="btn" data-act="close">Vazgeç</button>`);};
$("#card").addEventListener("click",e=>{
  const a=e.target.closest("[data-act]");if(!a)return;const act=a.dataset.act;
  if(act==="close")closeSheet();
  else if(act==="shuffle")shuffle();
  else if(act==="giveup"){closeSheet();S.over=true;S.mode==="free"?freeOver():lose("stuck");}
  else if(act==="next")startLevel(S.level+1);
  else if(act==="retry")startLevel(S.level);
  else if(act==="free")startFree();
  else if(act==="levels"){closeSheet();show("levels");}
  else if(act==="menu"){closeSheet();show("menu");}
});

/* ---------- sound ---------- */
let ac=null;
function unlockAudio(){if(!ac){try{ac=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(ac&&ac.state==="suspended")ac.resume();}
function tone(f,d,type="sine",vol=.12,delay=0){
  if(!ac||save.mute)return;const t=ac.currentTime+delay,o=ac.createOscillator(),g=ac.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g).connect(ac.destination);o.start(t);o.stop(t+d+0.03);
}
const semi=(b,n)=>b*Math.pow(2,n/12);
function sfx(k,lines=1,combo=1){
  if(k==="place")tone(196,.09,"triangle",.14);
  if(k==="clear"){const base=semi(392,Math.min(combo-1,7)*2);[0,4,7,12].slice(0,2+Math.min(lines,2)).forEach((n,i)=>tone(semi(base,n),.18,"sine",.1,i*.06));}
  if(k==="flower")[0,7].forEach((n,i)=>tone(semi(988,n),.14,"sine",.06,i*.05));
  if(k==="shuffle")[0,3,6].forEach((n,i)=>tone(semi(300,n),.08,"triangle",.08,i*.05));
  if(k==="win")[0,4,7,12,7,12,16].forEach((n,i)=>tone(semi(523,n),.22,"triangle",.11,i*.11));
  if(k==="fail")[7,4,0,-5].forEach((n,i)=>tone(semi(330,n),.25,"triangle",.1,i*.14));
}
function buzz(p){if(save.mute)return;try{navigator.vibrate&&navigator.vibrate(p);}catch(e){}}

/* ---------- boot ---------- */
function boot(data){
  if(data&&data.S){S=data.S;enterGame();if(S.over)S.over=false,checkStuck();}
  else show("menu");
}
try{window.claude?.hot?.snapshot?.(()=>({S:S&&!$("#game").hidden?S:null}));}catch(e){}
window.claude?.hot?.ready?window.claude.hot.ready(boot):boot(window.claude?.hot?.data??{});
})();
</script>
</body>
